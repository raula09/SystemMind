name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish and package
        run: |
          set -euo pipefail
          mkdir dist
          for rid in win-x64 linux-x64 linux-arm64; do
            dotnet publish DiagnoX.csproj -c Release -r "$rid" --self-contained true \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -o "out/$rid"
            if [[ "$rid" == win-* ]]; then
              (cd "out/$rid" && zip -r "../../dist/systemmind-$rid.zip" .)
            else
              tar -czf "dist/systemmind-$rid.tar.gz" -C "out/$rid" .
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
